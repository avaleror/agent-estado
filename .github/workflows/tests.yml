name: tests

on:
  push:
  pull_request:

jobs:
  sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: command -v dash >/dev/null || { sudo apt-get update && sudo apt-get install -y dash; }
      - run: go test ./...
      - run: sh tests/test.sh
      - run: dash tests/test.sh
